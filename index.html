<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B6B52">
<title>EDT — التوزيع الأسبوعي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF4F0;--card:#fff;--ink:#0F1F1A;--mute:#60726B;--line:#DCE7E2;--g:#0B6B52;--g1:#17A883;--g2:#E1F2EB;--td:#C27A0E;--tp:#4256C2;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0C1512;--card:#15211D;--ink:#E9F2EE;--mute:#8FA39B;--line:#25352F;--g:#2FC49B;--g1:#2FC49B;--g2:#18302A;--td:#E3A64B;--tp:#8F9DFF}}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,sans-serif;line-height:1.5}
.app{min-height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 18px 0}
[hidden]{display:none!important}
.top{text-align:center;padding:10px 0 6px}
.badge{display:inline-block;direction:ltr;font-weight:900;font-size:1.05rem;letter-spacing:.04em;color:var(--g);background:var(--g2);padding:4px 16px;border-radius:99px}
h1{font-size:2rem;font-weight:900;margin:10px 0 2px;line-height:1.2}
.hint{color:var(--mute);margin:0;font-size:1rem}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:14px 0 24px}
.stage{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
.orb{position:relative;width:190px;height:190px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:#fff;background:radial-gradient(circle at 35% 30%,var(--g1),var(--g));box-shadow:0 18px 40px -12px var(--g),inset 0 -8px 20px rgba(0,0,0,.18)}
.orb::before,.orb::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px solid var(--g1);opacity:.35;animation:ring 2.6s ease-out infinite}
.orb::after{animation-delay:1.3s}
@keyframes ring{from{transform:scale(.92);opacity:.5}to{transform:scale(1.18);opacity:0}}
.orb input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.orb svg{width:62px;height:62px;margin-bottom:6px}
.orb span{position:absolute;bottom:38px;font-weight:800;font-size:1.05rem}
.orb:focus-within{outline:4px solid var(--g1);outline-offset:6px}
.cap{color:var(--mute);margin:0;font-size:.95rem}
.err{background:#FDECEA;color:#B3261E;border-radius:16px;padding:12px 16px;font-weight:600;text-align:center;margin-bottom:14px}
/* loading: hand filling a table */
.tbl{position:relative;direction:ltr;display:grid;grid-template-columns:repeat(4,60px);grid-auto-rows:36px;gap:6px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:18px}
.tbl i{border-radius:8px;border:2px solid var(--line);animation:fill 3.6s infinite}
@keyframes fill{0%,6%{background:transparent;border-color:var(--line)}12%,86%{background:var(--g1);border-color:var(--g1)}100%{background:transparent;border-color:var(--line)}}
.hand{position:absolute;left:0;top:0;font-size:2rem;line-height:1;animation:move 3.6s infinite linear;filter:drop-shadow(0 3px 3px rgba(0,0,0,.25))}
@media(prefers-reduced-motion:reduce){.tbl i,.hand,.orb::before,.orb::after{animation:none}.tbl i{background:var(--g1)}}
.load p{font-weight:700;margin:0}
/* cards & chips */
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;margin-bottom:14px}
h2{font-size:.95rem;font-weight:700;color:var(--mute);margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{font:inherit;font-weight:800;font-size:1.05rem;flex:1 1 0;min-width:72px;min-height:54px;border-radius:16px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;transition:transform .15s}
.chip:active{transform:scale(.96)}
.chip[aria-pressed=true]{background:var(--g);border-color:var(--g);color:#fff;box-shadow:0 8px 18px -8px var(--g)}
#grps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;direction:ltr}
#grps .chip{min-width:0;padding:0}
.link{font:inherit;background:none;border:0;color:var(--mute);text-decoration:underline;min-height:40px;cursor:pointer}
.warn{font-size:.85rem;color:var(--mute);margin:10px 0 0}
.ttl{font-size:1.3rem;font-weight:900;margin:0 0 12px;direction:ltr;text-align:center;color:var(--g)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.tab{font:inherit;font-weight:700;flex:0 0 auto;min-height:46px;padding:6px 16px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:8px}
.tab b{font-size:.75rem;background:var(--g2);color:var(--g);border-radius:99px;min-width:22px;padding:0 6px}
.tab[aria-pressed=true]{background:var(--g);border-color:var(--g);color:#fff}.tab[aria-pressed=true] b{background:#ffffff33;color:#fff}
.tab.empty{opacity:.5}
#lv .chip,#sp .chip,#sm .chip{direction:ltr}
.line{margin-top:12px}
.ses{display:grid;grid-template-columns:62px 1fr;gap:12px;margin-bottom:10px}
.ses .t{direction:ltr;text-align:center;font-weight:800;font-size:.9rem;line-height:1.25;padding-top:10px}
.ses .t small{display:block;color:var(--mute);font-weight:400}
.ses .b{border-radius:18px;padding:12px 14px;background:var(--g2);border-inline-start:6px solid var(--g)}
.ses.TD .b{background:color-mix(in srgb,var(--td) 14%,var(--card));border-color:var(--td)}
.ses.TP .b{background:color-mix(in srgb,var(--tp) 14%,var(--card));border-color:var(--tp)}
.ses .s{font-weight:800;line-height:1.35}
.ses .m{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:.82rem}
.ses .m span{unicode-bidi:plaintext;background:var(--card);border-radius:99px;padding:1px 10px;font-weight:600}
.ses .m .k{background:var(--g);color:#fff}.TD .m .k{background:var(--td)}.TP .m .k{background:var(--tp)}
.none{text-align:center;color:var(--mute);padding:26px 0}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{font:inherit;font-weight:800;border:0;border-radius:16px;min-height:54px;background:var(--g);color:#fff;cursor:pointer}
.btn.alt{grid-column:1/-1;background:var(--g2);color:var(--g);min-height:46px}
.btn:active{transform:scale(.98)}.btn:focus-visible,.chip:focus-visible,.tab:focus-visible{outline:3px solid var(--g1);outline-offset:2px}
footer{text-align:center;color:var(--mute);font-size:.85rem;padding:14px 0 max(16px,env(safe-area-inset-bottom))}
footer b{color:var(--g);font-weight:800}
#xp{position:fixed;left:-99999px;top:0;width:1180px;background:#fff;color:#0F1F1A;padding:28px;direction:rtl;font-family:'Cairo',sans-serif}
#xp h1{font-size:30px;margin:0;color:#0B6B52;text-align:center;direction:ltr}
#xp p{margin:2px 0 16px;text-align:center;color:#60726B}
#xp table{width:100%;border-collapse:collapse;table-layout:fixed}
#xp th,#xp td{border:1px solid #CBD8D3;padding:6px;font-size:12px;vertical-align:top;text-align:center}
#xp th{background:#0B6B52;color:#fff}#xp td.h{background:#EDF4F0;font-weight:600;direction:ltr;width:90px}
#xp .c{border-radius:6px;padding:4px;margin-bottom:3px;background:#E1F2EB;border-inline-start:4px solid #0B6B52;text-align:right}
#xp .c.TD{background:#FBF0DC;border-color:#C27A0E}#xp .c.TP{background:#E4E8FA;border-color:#4256C2}
#xp .ft{margin-top:12px;text-align:center;color:#60726B;font-size:12px}
#dev{border:0;border-radius:24px;padding:22px;margin:auto;width:min(92vw,420px);max-height:86dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--card);color:var(--ink);font-family:inherit;font-size:1rem;direction:rtl;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
#dev::backdrop{background:rgba(0,0,0,.55)}
#dev h3{margin:0;font-size:1.5rem;font-weight:900;color:var(--g)}
#dev .role{color:var(--mute);margin:2px 0 12px;font-weight:700}
#dev p{margin:0 0 14px;line-height:1.8}
.facts{text-align:right;background:var(--g2);border-radius:16px;padding:12px 14px;margin-bottom:14px}
.facts p{margin:0 0 8px;font-size:.95rem;line-height:1.7}.facts p:last-child{margin:0}.facts b{color:var(--g)}
#dev .quote{font-weight:800;color:var(--g)}
.devl{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.devl a{display:block;padding:11px 14px;border-radius:14px;background:var(--g2);color:var(--g);font-weight:800;text-decoration:none;overflow-wrap:anywhere}
#dev .btn{width:100%}
@media print{.app{display:none}#xp{position:static;width:100%}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <span class="badge">EDT</span>
    <h1>التوزيع الأسبوعي</h1>
    <p class="hint" id="hint">ارفع ملف جدول استعمال الزمن</p>
  </header>
  <main>
    <div class="err" id="err" hidden></div>

    <section class="stage" id="up">
      <label class="orb">
        <input type="file" id="file" accept="application/pdf,.pdf" aria-label="تحميل ملف EDT">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4m0 0L8 8m4-4l4 4"/><path d="M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3"/></svg>
        <span>تحميل ملف EDT</span>
      </label>
      <p class="cap">الملفات المقبولة: PDF فقط</p>
    </section>

    <section class="stage load" id="load" hidden>
      <div class="tbl" id="tbl"><div class="hand">✍️</div></div>
      <p id="loadTxt">جاري تحليل الجدول...</p>
    </section>

    <section id="pick" hidden>
      <div class="card">
        <div id="lvBox" hidden><h2>السنة</h2><div class="chips" id="lv"></div></div>
        <div id="spBox" hidden><h2 style="margin-top:18px">التخصص</h2><div class="chips" id="sp"></div></div>
        <div id="smBox" hidden><h2 style="margin-top:18px">الفصل</h2><div class="chips" id="sm"></div></div>
        <div id="scBox" hidden><h2 style="margin-top:18px">الأقسام</h2><div class="chips" id="secs"></div></div>
        <div id="grpBox" hidden>
          <h2 style="margin-top:18px">المجموعات</h2>
          <div id="grps"></div>
        </div>
        <p class="warn" id="warn" hidden></p>
        <button class="link" id="again">تغيير الملف</button>
      </div>
      <div class="card" id="out" hidden>
        <p class="ttl" id="ttl"></p>
        <p class="cap" id="sub" style="text-align:center;margin:-6px 0 12px;direction:ltr"></p>
        <div class="tabs" id="tabs"></div>
        <div class="line" id="line"></div>
        <div class="acts">
          <button class="btn" id="bPdf">تحميل PDF</button>
          <button class="btn" id="bImg">تحميل صورة</button>
          <button class="btn alt" id="bPrint">طباعة</button>
        </div>
      </div>
    </section>
  </main>
  <footer><button class="link" id="devBtn">معلومات عن المطور</button></footer>
</div>
<dialog id="dev" aria-labelledby="devName">
  <h3 id="devName"></h3>
  <p class="role" id="devRole"></p>
  <p id="devBio"></p>
  <div class="facts" id="devFacts"></div>
  <p class="quote" id="devQuote"></p>
  <div class="devl" id="devLinks"></div>
  <button class="btn" id="devClose">إغلاق</button>
</dialog>
<div id="xp" aria-hidden="true"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* ============ 1) Generic EDT parser (no hardcoded levels, specialties or schedule data) ============ */
const DAYS=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const AR={Dimanche:'الأحد',Lundi:'الإثنين',Mardi:'الثلاثاء',Mercredi:'الأربعاء',Jeudi:'الخميس',Vendredi:'الجمعة',Samedi:'السبت'};
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const DAYMAP=Object.fromEntries(DAYS.map(d=>[norm(d),d]));
Object.entries(AR).forEach(([f,a])=>DAYMAP[norm(a)]=f);DAYMAP[norm('الاثنين')]='Lundi';
const dayOf=s=>DAYMAP[norm(s)]||null;
const TIME_RE=/^\d{1,2}[:hH]\d{2}\s*[–—-]\s*\d{1,2}[:hH]\d{2}$/;
// header like "EDT Provisoire-L2-INFO Semestre 3-2025/2026": level = first token, specialty = whatever follows it
const KW_RE=/\bEDT\b|emploi\s+du\s+temps|timetable|class\s+schedule|استعمال\s+الزمن|استعمال\s+الوقت|جدول\s+(?:الحصص|التوقيت|الأوقات)/i;
const HEAD_RE=/\b((?:[A-Za-z]{1,3}\d|\d[A-Za-z]{1,3}))\s*-\s*(.+?)\s+S(?:emestre|emester|em\.?)?\s*(\d+)\b(?:\s*-\s*(\d{4}\s*\/\s*\d{4}))?/i;
const nat=(a,b)=>String(a).localeCompare(String(b),'en',{numeric:true});
const uniq=a=>[...new Set(a)];

function parseCell(txt){
  let parts=txt.split(/\s+\/\s+/).map(x=>x.trim()).filter(Boolean);
  let ti=parts.findIndex(p=>/^(cours?|td|tp)$/i.test(p));
  if(ti<0){parts=txt.split(/\s*\/\s*/).map(x=>x.trim()).filter(Boolean);ti=parts.findIndex(p=>/^(cours?|td|tp)$/i.test(p));}
  if(ti<0) return null;
  let section='',group='',a;
  parts.slice(0,ti).forEach(p=>{if(a=p.match(/^Section\s*(\d+)$/i))section=a[1];else if(a=p.match(/^(G\s*\d+)$/i))group=a[1].replace(/\s/g,'').toUpperCase();});
  const rest=parts.slice(ti+1);if(!rest.length) return null;
  const teacher=(rest.length>1?rest.pop():'').replace(/\*+/g,'').trim();
  const t=parts[ti].toLowerCase();
  return {section,group,type:t.startsWith('cour')?'Cours':t==='td'?'TD':'TP',subject:rest.join(' / ').trim(),teacher};
}

async function parseEDT(file){
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  const out={tables:[],sessions:[],skipped:[],looks:false};
  let cur=null,day=null;
  for(let p=1;p<=pdf.numPages;p++){
    const tc=await (await pdf.getPage(p)).getTextContent();
    const it=tc.items.filter(i=>i.str.trim()).map(i=>({s:i.str.trim(),x:i.transform[4]+i.width/2,y:i.transform[5]}));
    const all=tc.items.map(i=>i.str).join(' ').replace(/\s+/g,' ');
    if(KW_RE.test(all)) out.looks=true;
    const m=all.match(HEAD_RE);
    if(m){
      out.looks=true;
      const level=m[1].toUpperCase(),spec=m[2].replace(/[\s-]+$/,'').trim(),sem=m[3],year=(m[4]||'').replace(/\s/g,''),key=[level,spec,sem].join('|');
      cur=out.tables.find(t=>t.key===key);
      if(!cur){cur={key,level,spec,sem,year,slots:[]};out.tables.push(cur);}
      day=null;
    }
    let hs=it.filter(i=>TIME_RE.test(i.s)).sort((a,b)=>a.x-b.x);
    if(hs.length<2){ // pdf.js may split "08:10–09:30" into three items
      const tm=it.filter(i=>/^\d{1,2}[:hH]\d{2}$/.test(i.s));if(tm.length<4) continue;
      const ty=Math.max(...tm.map(i=>i.y));
      const row=tm.filter(i=>Math.abs(i.y-ty)<4).sort((a,b)=>a.x-b.x);hs=[];
      for(let k=0;k+1<row.length;k+=2)hs.push({s:row[k].s+'–'+row[k+1].s,x:(row[k].x+row[k+1].x)/2,y:ty});
    }
    if(hs.length<2) continue;
    if(it.some(i=>dayOf(i.s))) out.looks=true; // days + time slots = a timetable grid, whatever the title says
    if(!cur){cur={key:'?|?|0',level:'—',spec:'—',sem:'0',year:'',slots:[]};out.tables.push(cur);}
    const hy=hs[0].y,cx=hs.map(h=>h.x),left=cx[0]-(cx[1]-cx[0])/2;
    const slotOf=hs.map(h=>{const [a,b]=h.s.replace(/[hH]/g,':').split(/\s*[–—-]\s*/);return {start:a.padStart(5,'0'),end:b.padStart(5,'0')}});
    slotOf.forEach(s=>{if(!cur.slots.some(o=>o.start===s.start))cur.slots.push(s)});
    const side=it.filter(i=>i.x<left&&i.y<hy-2);
    const marks=side.filter(i=>dayOf(i.s));
    const rooms=side.filter(i=>!dayOf(i.s)).sort((a,b)=>b.y-a.y);
    // rooms are alphabetical inside a day: a non-increasing room name starts a new day block
    let blk=null;
    rooms.forEach(r=>{
      if(!blk||nat(r.s,blk.last)<=0){blk={last:'',top:r.y,bot:r.y};}
      r.blk=blk;blk.last=r.s;blk.bot=r.y;
    });
    const seen=new Set();
    rooms.forEach(r=>{const b=r.blk;if(seen.has(b))return;seen.add(b);
      const mk=marks.find(d=>d.y<=b.top+30&&d.y>=b.bot-30);if(mk)day=dayOf(mk.s);b.day=day;});
    const cells=new Map();
    it.filter(i=>i.x>=left&&i.y<hy-2).forEach(i=>{
      let ci=0;cx.forEach((c,k)=>{if(Math.abs(i.x-c)<Math.abs(i.x-cx[ci]))ci=k});
      let ri=0;rooms.forEach((r,k)=>{if(Math.abs(i.y-r.y)<Math.abs(i.y-rooms[ri].y))ri=k});
      const key=ri+'|'+ci;(cells.get(key)||cells.set(key,[]).get(key)).push(i);
    });
    const tk=cur.key;
    cells.forEach((arr,key)=>{
      const [ri,ci]=key.split('|').map(Number);const room=rooms[ri];
      const txt=arr.sort((a,b)=>b.y-a.y||a.x-b.x).map(i=>i.s).join(' ').replace(/\s+/g,' ').trim();
      const q=parseCell(txt);
      if(!q||!room.blk.day){out.skipped.push({tk,txt});return;}
      out.sessions.push({tk,day:room.blk.day,start:slotOf[ci].start,end:slotOf[ci].end,room:room.s,...q});
    });
  }
  cur=null;
  out.tables.forEach(t=>t.slots.sort((a,b)=>a.start.localeCompare(b.start)));
  const u=new Map();out.sessions.forEach(s=>u.set([s.tk,s.day,s.start,s.room,s.section,s.group,s.type,s.subject].join('|'),s));
  out.sessions=[...u.values()];
  out.tables=out.tables.filter(t=>out.sessions.some(s=>s.tk===t.key));
  return out;
}

/* ============ 2) Dynamic selection model ============ */
const filterFor=(ss,tk,sec,grp)=>ss.filter(s=>s.tk===tk&&s.section===sec&&(s.type==='Cours'||!s.group||s.group===grp));

/* ============ 3) Renderer + exporter ============ */
const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D=null,st={},dayK=null;
const curTable=()=>D.tables.find(t=>t.level===st.lvl&&t.spec===st.spc&&t.sem===st.sem);
const lbl=()=>[`${st.lvl}-${st.spc}`,st.sec?'S'+st.sec:'',st.grp||''].filter(Boolean).join(' — ');
const view=n=>['up','load','pick'].forEach(k=>$(k).hidden=(k!==n));

// loading animation: a hand filling a table, cell by cell
(function(){const t=$('tbl'),N=12;let kf='@keyframes move{';
  for(let i=0;i<N;i++){const r=Math.floor(i/4),c=i%4;t.insertBefore(Object.assign(document.createElement('i'),{style:`animation-delay:${i*0.3}s`}),t.lastElementChild);
    kf+=`${(i/N*100).toFixed(1)}%{transform:translate(${12+c*66+18}px,${12+r*42+4}px)}`;}
  kf+='100%{transform:translate(18px,16px)}}';const s=document.createElement('style');s.textContent=kf;document.head.appendChild(s);})();

function chips(box,items,cur,fmt,fn){box.innerHTML='';
  items.forEach(v=>{const b=document.createElement('button');b.className='chip';b.textContent=fmt(v);
    b.setAttribute('aria-pressed',v===cur);b.onclick=()=>fn(v);box.appendChild(b)});}
const box=(id,show)=>$(id+'Box').hidden=!show;

function renderPick(){
  const tb=D.tables;
  const lv=uniq(tb.map(t=>t.level)).sort(nat);
  if(!st.lvl&&lv.length===1)st.lvl=lv[0];
  box('lv',lv.length);chips($('lv'),lv,st.lvl,x=>x,v=>{st={lvl:v};renderPick()});
  const sp=st.lvl?uniq(tb.filter(t=>t.level===st.lvl).map(t=>t.spec)).sort(nat):[];
  if(st.lvl&&!st.spc&&sp.length===1)st.spc=sp[0];
  box('sp',st.lvl&&sp.length);chips($('sp'),sp,st.spc,x=>x,v=>{st={lvl:st.lvl,spc:v};renderPick()});
  const sm=st.spc?uniq(tb.filter(t=>t.level===st.lvl&&t.spec===st.spc).map(t=>t.sem)).sort(nat):[];
  if(st.spc&&!st.sem&&sm.length===1)st.sem=sm[0];
  box('sm',sm.length>1);chips($('sm'),sm,st.sem,x=>'الفصل '+x,v=>{st={lvl:st.lvl,spc:st.spc,sem:v};renderPick()});
  const t=st.sem?curTable():null;
  const secs=t?uniq(D.sessions.filter(s=>s.tk===t.key).map(s=>s.section)).sort(nat):[];
  if(t&&st.sec===undefined&&secs.length===1)st.sec=secs[0];
  box('sc',t&&(secs.length>1||secs[0]!==''));
  chips($('secs'),secs,st.sec,s=>s?'القسم '+s:'الكل',v=>{st={lvl:st.lvl,spc:st.spc,sem:st.sem,sec:v};renderPick()});
  const gs=t&&st.sec!==undefined?uniq(D.sessions.filter(s=>s.tk===t.key&&s.section===st.sec&&s.group).map(s=>s.group)).sort(nat):[];
  box('grp',gs.length);chips($('grps'),gs,st.grp,x=>x,v=>{st.grp=v;dayK=null;renderPick();$('out').scrollIntoView({behavior:'smooth',block:'start'})});
  const sk=t?D.skipped.filter(k=>k.tk===t.key).length:0;
  $('warn').hidden=!sk;if(sk)$('warn').textContent=`لم أستطع قراءة ${sk} خلية، فتركتها بدل أن أخمّن.`;
  if(t&&st.sec!==undefined&&(!gs.length||st.grp)) renderOut(t); else $('out').hidden=true;
}

function renderOut(t){
  const list=filterFor(D.sessions,t.key,st.sec,st.grp);
  const days=DAYS.filter(d=>d!=='Vendredi'||list.some(s=>s.day===d));
  const cnt=d=>list.filter(s=>s.day===d).length;
  if(!dayK||!cnt(dayK)) dayK=days.find(cnt)||days[0];
  $('ttl').textContent=lbl();
  $('sub').textContent=[t.sem!=='0'?'Semestre '+t.sem:'',t.year].filter(Boolean).join(' — ');
  $('tabs').innerHTML=days.map(d=>`<button class="tab${cnt(d)?'':' empty'}" data-d="${d}" aria-pressed="${d===dayK}">${AR[d]}<b>${cnt(d)}</b></button>`).join('');
  $('tabs').onclick=e=>{const b=e.target.closest('.tab');if(b){dayK=b.dataset.d;renderOut(t);}};
  const rows=list.filter(s=>s.day===dayK).sort((a,b)=>a.start.localeCompare(b.start));
  $('line').innerHTML=rows.length?rows.map(s=>`<div class="ses ${s.type}"><div class="t">${s.start}<small>${s.end}</small></div><div class="b"><div class="s">${esc(s.subject)}</div><div class="m"><span class="k">${s.type}</span>${s.teacher?`<span>${esc(s.teacher)}</span>`:''}<span>${esc(s.room)}</span></div></div></div>`).join(''):'<div class="none">لا توجد حصص في هذا اليوم</div>';
  $('xp').innerHTML=`<h1>${esc(lbl())}</h1><p>Emploi du Temps ${[t.year,t.sem!=='0'?'Semestre '+t.sem:''].filter(Boolean).map(esc).join(' — ')}</p><table><tr><th></th>${days.map(d=>`<th>${AR[d]}</th>`).join('')}</tr>`+
    t.slots.map(sl=>`<tr><td class="h">${sl.start}–${sl.end}</td>${days.map(d=>`<td>${list.filter(s=>s.day===d&&s.start===sl.start).map(s=>`<div class="c ${s.type}"><b>${esc(s.subject)}</b><br>${s.type}${s.teacher?' · '+esc(s.teacher):''} · ${esc(s.room)}</div>`).join('')}</td>`).join('')}</tr>`).join('')+'</table><div class="ft">${esc(devLine())}</div>';
  $('out').hidden=false;
}
const shot=()=>html2canvas($('xp'),{scale:2,backgroundColor:'#fff'});
const fname=()=>lbl().replace(/[^\w]+/g,'_');
function save(href,name){const a=document.createElement('a');a.href=href;a.download=name;document.body.appendChild(a);a.click();a.remove();}
$('bImg').onclick=async()=>{save((await shot()).toDataURL('image/png'),fname()+'.png')};
$('bPdf').onclick=async()=>{const c=await shot();const {jsPDF}=window.jspdf;
  const pdf=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
  const W=pdf.internal.pageSize.getWidth()-10,H=pdf.internal.pageSize.getHeight()-10,k=Math.min(W/c.width,H/c.height);
  pdf.addImage(c.toDataURL('image/png'),'PNG',5,5,c.width*k,c.height*k);pdf.save(fname()+'.pdf');};
$('bPrint').onclick=()=>window.print();

/* ============ 4) Flow ============ */
const HINT='ارفع ملف جدول استعمال الزمن';
function fail(msg){$('err').textContent=msg;$('err').hidden=false;view('up');$('file').value='';}
$('again').onclick=()=>{D=null;st={};$('file').value='';$('err').hidden=true;view('up');$('hint').textContent=HINT;};
const isPdf=f=>f.type==='application/pdf'||/\.pdf$/i.test(f.name);
$('file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  $('err').hidden=true;
  if(!isPdf(f)) return fail('الملفات المقبولة: PDF فقط.');
  $('loadTxt').textContent='جاري تحليل الجدول...';
  view('load');
  try{
    const [r]=await Promise.all([parseEDT(f),new Promise(ok=>setTimeout(ok,1800))]);
    if(!r.looks) return fail('لم أجد في هذا الملف ما يدل على أنه جدول استعمال زمن، لا عنوان جدول ولا شبكة أيام وفترات. تأكد أنك رفعت الملف الصحيح.');
    if(!r.tables.length) return fail('تعرّفت على الملف كجدول استعمال زمن، لكنني لم أستطع استخراج أي حصة منه.');
    D=r;st={};dayK=null;
    $('hint').textContent='اختر السنة ثم التخصص';
    $('out').hidden=true;view('pick');renderPick();
  }catch(x){console.error(x);fail('لم أستطع فتح الملف. تأكد أنه PDF سليم وبنص قابل للتحديد.');}
};
